[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postgres_csvpatcher"
version = "0.1.1"
description = "Automatically add ::timestamp(0) casts to timestamp columns in PostgreSQL CSV dump queries using native libpg_query parser"
requires-python = ">=3.10"
dependencies = [
    "pglast>=7.13",
]

[tool.setuptools.packages.find]
where = ["src"]
